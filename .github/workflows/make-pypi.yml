name: make-pypi
on:
  workflow_dispatch:
    inputs:
      publish:
        required: true
        type: boolean

jobs:
  main:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run:  uv build --wheel
      - run:  uv publish
        if: ${{ inputs.publish == true }}
